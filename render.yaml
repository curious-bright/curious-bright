services:
  - type: web
    name: curious-bright-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r apps/backend/requirements.txt
    startCommand: bash apps/backend/scripts/start.sh
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: curiousbright.com.ng,www.curiousbright.com.ng,api.curiousbright.com.ng
      - key: CSRF_TRUSTED_ORIGINS
        value: https://curiousbright.com.ng,https://app.curiousbright.com.ng,https://org.curiousbright.com.ng
      - key: CORS_ALLOWED_ORIGINS
        value: https://curiousbright.com.ng,https://app.curiousbright.com.ng,https://org.curiousbright.com.ng
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: PORT
        value: 10000
